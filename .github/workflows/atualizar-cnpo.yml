# Atualiza os dados de produtores orgânicos com a planilha mais nova do CNPO (MAPA).
# O Ministério atualiza nos dias 5, 15 e 25; esta tarefa roda no dia seguinte, às 9h (Brasília).
# Ela nunca publica sozinha: abre um pedido de mudança (pull request) com o resumo, e o site só muda quando ele é aprovado.
# Também dá para rodar na mão: aba Actions > Atualizar CNPO > Run workflow.
name: Atualizar CNPO

on:
  schedule:
    - cron: "0 12 6,16,26 * *"
  workflow_dispatch:
  pull_request:  # teste: quando a própria tarefa muda, roda e comenta o resumo no pedido, sem publicar nada
    paths:
      - ".github/workflows/atualizar-cnpo.yml"
      - "scripts/10_atualizar_cnpo.py"
      - "scripts/05_produtores.py"
      - "scripts/06_pacote_ambiente.py"
      - "scripts/07_produtos.py"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: atualizar-cnpo
  cancel-in-progress: false

jobs:
  cnpo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # com "pipefail": um erro antes do tee também para a tarefa
    env:
      ORG_BASE: ${{ github.workspace }}
      ORG_SRC: /tmp/origem
      ORG_PRIVADO: /tmp/privado
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar bibliotecas
        run: pip install -r scripts/requirements.txt

      - name: Diagnóstico de rede (só no teste)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          for u in https://www.gov.br/ https://www.gov.br/agricultura/pt-br https://dados.agricultura.gov.br/ https://example.com/; do
            echo "$u -> $(curl -s -o /dev/null -m 30 -w '%{http_code} %{remote_ip}' "$u" 2>&1 || echo falhou)" | tee -a /tmp/registro.txt
          done
          curl -s -m 10 https://ipinfo.io/country | sed 's/^/país do servidor: /' | tee -a /tmp/registro.txt || true

      - name: Baixar e conferir a planilha do CNPO
        id: baixar
        run: python scripts/10_atualizar_cnpo.py baixar 2>&1 | tee -a /tmp/registro.txt

      - name: Refazer produtores, produtos e pacote do mapa
        if: steps.baixar.outputs.mudou == 'true'
        run: |
          set -o pipefail
          python scripts/05_produtores.py 2>&1 | tee -a /tmp/registro.txt
          python scripts/07_produtos.py 2>&1 | tail -5 | tee -a /tmp/registro.txt
          python scripts/06_pacote_ambiente.py 2>&1 | tee -a /tmp/registro.txt

      - name: Conferir e resumir
        if: steps.baixar.outputs.mudou == 'true'
        run: python scripts/10_atualizar_cnpo.py resumir 2>&1 | tee -a /tmp/registro.txt

      - name: Mostrar o resumo
        if: always()
        run: test -f resumo_cnpo.md && cat resumo_cnpo.md >> "$GITHUB_STEP_SUMMARY" || echo "Nada novo no CNPO." >> "$GITHUB_STEP_SUMMARY"

      # modo teste (pedido de mudança da própria tarefa): só comenta o resumo
      - name: Comentar o resultado do teste
        if: always() && github.event_name == 'pull_request'
        run: |
          { echo "**Teste da tarefa de atualização do CNPO** (nada foi publicado)"; echo;
            if [ -f resumo_cnpo.md ]; then cat resumo_cnpo.md; else echo "A planilha é igual à última usada: nada a atualizar."; fi;
            echo; echo "Arquivos que mudariam:"; echo '```'; git status --short; echo '```';
            echo; echo "<details><summary>Registro</summary>"; echo; echo '```'; tail -40 /tmp/registro.txt 2>/dev/null; echo '```'; echo "</details>"; } > comentario.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comentario.md

      # modo normal: abre o pedido de mudança com os dados novos
      - name: Abrir pedido de mudança
        if: steps.baixar.outputs.mudou == 'true' && github.event_name != 'pull_request'
        run: |
          ramo="atualizacao/cnpo-${{ steps.baixar.outputs.data }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$ramo"
          git add dados ambiente referencias/sigorg_sem_identificacao.csv
          git commit -m "Dados: CNPO ${{ steps.baixar.outputs.arquivo }}"
          git push -f origin "$ramo"
          titulo="Atualizar dados do CNPO (${{ steps.baixar.outputs.arquivo }})"
          if ! gh pr create --base main --head "$ramo" --title "$titulo" --body-file resumo_cnpo.md --assignee "${{ github.repository_owner }}"; then
            # se o repositório não deixar a tarefa abrir pedidos, avisa por um aviso (issue) com o link
            { cat resumo_cnpo.md; echo; echo "Para ver e aprovar: ${{ github.server_url }}/${{ github.repository }}/compare/main...$ramo?expand=1"; } > aviso.md
            gh issue create --title "$titulo" --body-file aviso.md --assignee "${{ github.repository_owner }}"
          fi

      - name: Avisar se deu errado
        if: failure() && github.event_name != 'pull_request'
        run: |
          { if [ -f resumo_cnpo.md ]; then cat resumo_cnpo.md; else echo "A tarefa parou antes de terminar."; fi;
            echo; echo '```'; tail -20 /tmp/registro.txt 2>/dev/null; echo '```';
            echo; echo "Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > aviso.md
          gh issue create --title "Atualização do CNPO não foi feita" --body-file aviso.md --assignee "${{ github.repository_owner }}"
